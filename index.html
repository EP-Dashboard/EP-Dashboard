        <label class="layer-btn active" data-layer="target">
          <input type="radio" name="layer" value="target" checked /> Target
        </label>
        <label class="layer-btn" data-layer="tactic">
          <input type="radio" name="layer" value="tactic" /> Tactic
        </label>
        <label class="layer-btn" data-layer="venue">
          <input type="radio" name="layer" value="venue" /> Venue
        </label>
        <label class="layer-btn" data-layer="builder">
          <input type="radio" name="layer" value="builder" /> Metrics Builder
        </label>
      </div>

      <div class="map-section" id="mapSection">
        <div class="map-content">
          <div id="map"></div>
          <div class="map-legend" id="mapLegend"></div>
        </div>
      </div>

      <!-- Resizable divider between map and metrics -->
      <div class="divider divider-h" id="vDivider"></div>

      <div class="metrics-section-panel" id="metricsSectionPanel">
        <div class="metrics-scroll">
          <div class="metrics-card metrics-card-full">
            <button type="button" id="metricsCopyBtn" class="metrics-copy-btn" title="Copy chart image to clipboard">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <div class="metrics-card-header">
              <span class="metrics-card-title" id="metricsChartTitle">Incidents by Target</span>
              <span class="metrics-breakdown-inline">
                <label class="metrics-breakdown-label" for="metricsBreakBy">Break down by</label>
                <select id="metricsBreakBy" class="filter-input filter-select metrics-breakdown-select"></select>
              </span>
            </div>
            <div class="metrics-chart-wrap metrics-chart-wrap-full"><canvas id="chartMain"></canvas></div>
          </div>
        </div>
      </div>

      <!-- Metrics Builder: replaces map + metrics panels when its tab is active -->
      <div class="builder-section-panel" id="builderSectionPanel" style="display: none;">
        <div class="builder-toolbar">
          <div class="filter-group">
            <label class="filter-label">Chart type</label>
            <select id="builderType" class="filter-input filter-select">
              <option value="vbar">Vertical Bar</option>
              <option value="hbar">Horizontal Bar</option>
              <option value="sbar">Stacked Bar</option>
              <option value="pie">Pie</option>
              <option value="line">Line (over time)</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">X axis</label>
            <select id="builderX" class="filter-input filter-select"></select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Y axis</label>
            <select class="filter-input filter-select filter-disabled" disabled>
              <option>Count of Incidents</option>
            </select>
          </div>
          <div class="filter-group" id="builderBreakGroup">
            <label class="filter-label">Break down by</label>
            <select id="builderBreak" class="filter-input filter-select"></select>
          </div>
          <button type="button" id="builderAddBtn" class="filter-reset builder-add-btn" title="Add chart">+ Add Chart</button>
        </div>
        <div class="metrics-scroll">
          <div class="metrics-builder-grid" id="builderGrid"></div>
          <div class="builder-empty" id="builderEmpty">No charts yet — set the options above and click "Add Chart" to build one.</div>
        </div>
      </div>

    </section>

    <!-- Resizable divider -->
    <div class="divider" id="divider"></div>

    <!-- Table panel -->
    <section class="table-panel">
      <div class="table-toolbar">
        <span class="table-count" id="tableCount">-- incidents</span>

        <div class="filter-group">
          <label class="filter-label">From</label>
          <input type="date" id="filterDateFrom" class="filter-input filter-date" />
        </div>
        <div class="filter-group">
          <label class="filter-label">To</label>
          <input type="date" id="filterDateTo" class="filter-input filter-date" />
        </div>

        <div class="filter-group">
          <label class="filter-label">Target</label>
          <div class="ms-wrap" id="msTarget"></div>
        </div>

        <div class="filter-group">
          <label class="filter-label">Tactic</label>
          <div class="ms-wrap" id="msTactic"></div>
        </div>

        <div class="filter-group">
          <label class="filter-label">Venue</label>
          <div class="ms-wrap" id="msVenue"></div>
        </div>

        <div class="filter-group">
          <label class="filter-label">Country</label>
          <div class="ms-wrap" id="msCountry"></div>
        </div>

        <div class="filter-group filter-search-group">
          <input type="text" id="filterSearch" class="filter-input filter-search" placeholder="Search… (try: judge OR justice)" title="Supports: word OR word, -word to exclude, &quot;exact phrase&quot;" />
        </div>

        <button id="filterReset" class="filter-reset" title="Clear all filters">✕</button>
      </div>
      <div class="table-scroll">
        <table id="incidentTable">
          <thead>
            <tr>
              <th data-col="Date">Date <span class="sort-icon">&#8597;</span></th>
              <th data-col="Target">Target <span class="sort-icon">&#8597;</span></th>
              <th data-col="Tactic">Tactic <span class="sort-icon">&#8597;</span></th>
              <th data-col="Venue">Venue <span class="sort-icon">&#8597;</span></th>
              <th data-col="Location">Location <span class="sort-icon">&#8597;</span></th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr class="placeholder-row">
              <td colspan="5">Loading incidents...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    // ── COLOR MAPS BY LAYER ──────────────────────────────────────────────
    const LAYER_COLORS = {
      target: {
        'Local Government':    '#4d90c4',
        'Celebrity':            '#e91e63',
        'Federal Government':  '#2b7fd4',
        'State Government':    '#00b0a0',
        'Business Executive':  '#e8962a',
        'Community Leader':    '#9b59b6',
      },
      tactic: {
        'Verbal/Written Threat': '#c8a800',
        'Harassment':             '#ff9900',
        'Attack':                 '#e53935',
        'Stalking':               '#9b59b6',
        'Other Crime':            '#00acc1',
      },
      venue: {
        'Office':                  '#4d90c4',
        'Home':                    '#00b050',
        'Public Area':              '#e8962a',
        'Communication Channels':  '#cc00cc',
        'Restricted Area':         '#e53935',
      },
    };
    const LAYER_FIELD = { target: 'Target', tactic: 'Tactic', venue: 'Venue' };
    const LAYER_LABEL = { target: 'Target', tactic: 'Tactic', venue: 'Venue' };
    const DEFAULT_COLOR = '#8b949e';

    function colorFor(layer, value) {
      if (!value) return DEFAULT_COLOR;
      var map = LAYER_COLORS[layer] || {};
      return map[value.trim()] || DEFAULT_COLOR;
    }

    // Canonical vocab per layer (so categories with zero current incidents,
    // like "Other Crime", still appear in filters/legend). Union with any
    // data values not yet in the vocab, as a defensive fallback.
    const LAYER_VALUES = {
      target: Object.keys(LAYER_COLORS.target),
      tactic: Object.keys(LAYER_COLORS.tactic),
      venue:  Object.keys(LAYER_COLORS.venue),
    };

    function fieldOptions(layerKey) {
      var field = LAYER_FIELD[layerKey];
      var canonical = LAYER_VALUES[layerKey];
      var observed = Array.from(new Set(incidents.map(function(r){ return (r[field]||'').trim(); }).filter(Boolean)));
      var extra = observed.filter(function(v){ return canonical.indexOf(v) === -1; }).sort();
      return canonical.concat(extra);
    }

    // Generic field metadata for the metrics chart AND the Metrics Builder.
    // Target/Tactic/Venue reuse the same color maps/vocab as the map layers;
    // Country and Domestic/Int'l are data-only fields with no map layer, so
    // they get a cycling brand-color palette instead of a fixed color map.
    const GENERIC_PALETTE = ['#2b7fd4','#e91e63','#00b0a0','#e8962a','#9b59b6','#00acc1','#8b5cf6','#f06292','#66bb6a','#c8a800'];

    function genericColor(fieldKey, value) {
      var opts = BUILDER_FIELDS[fieldKey].opts();
      var idx = opts.indexOf(value);
      if (idx < 0) idx = 0;
      return GENERIC_PALETTE[idx % GENERIC_PALETTE.length];
    }

    const BUILDER_FIELDS = {
      target:  { csv: 'Target', label: 'Target', colorFn: function(v) { return colorFor('target', v); }, opts: function() { return fieldOptions('target'); } },
      tactic:  { csv: 'Tactic', label: 'Tactic', colorFn: function(v) { return colorFor('tactic', v); }, opts: function() { return fieldOptions('tactic'); } },
      venue:   { csv: 'Venue', label: 'Venue', colorFn: function(v) { return colorFor('venue', v); }, opts: function() { return fieldOptions('venue'); } },
      country: { csv: 'Country', label: 'Country', colorFn: function(v) { return genericColor('country', v); },
                 opts: function() { return Array.from(new Set(incidents.map(function(r){ return (r['Country']||'').trim(); }).filter(Boolean))).sort(); } },
      domintl: { csv: "Domestic/Int'l", label: "Domestic/Int'l", colorFn: function(v) { return genericColor('domintl', v); },
                 opts: function() { return ['Domestic', 'International']; } }
    };
    const BUILDER_FIELD_ORDER = ['target', 'tactic', 'venue', 'country', 'domintl'];

    // Generic categorical aggregation: counts of xKey, optionally stacked/
    // segmented by breakKey. Used by both the single metrics chart and every
    // Metrics Builder chart.
    function buildCategoricalData(rows, xKey, breakKey) {
      var xMeta = BUILDER_FIELDS[xKey];
      var xLabels = xMeta.opts();

      if (breakKey && breakKey !== 'none') {
        var bMeta = BUILDER_FIELDS[breakKey];
        var bLabels = bMeta.opts();
        var datasets = bLabels.map(function(bl) {
          var data = xLabels.map(function(xl) {
            return rows.filter(function(r) {
              return (r[xMeta.csv] || '').trim() === xl && (r[bMeta.csv] || '').trim() === bl;
            }).length;
          });
          return { label: bl, data: data, backgroundColor: bMeta.colorFn(bl), stack: 's1', borderRadius: 2, borderSkipped: false };
        });
        return { labels: xLabels, datasets: datasets };
      }

      var counts = xLabels.map(function(xl) {
        return rows.filter(function(r) { return (r[xMeta.csv] || '').trim() === xl; }).length;
      });
      var colors = xLabels.map(function(xl) { return xMeta.colorFn(xl); });
      return { labels: xLabels, datasets: [{ label: xMeta.label, data: counts, backgroundColor: colors, borderRadius: 3, borderSkipped: false }] };
    }

    // Month-bucketed aggregation for the Line (over time) chart type.
    const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function monthBucket(dateStr) {
      var iso = toISO(dateStr || '');
      return iso ? iso.slice(0, 7) : null; // 'YYYY-MM'
    }

    function monthLabel(ym) {
      var parts = ym.split('-');
      return MONTH_SHORT[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
    }

    function buildLineData(rows, breakKey) {
      var buckets = {};
      rows.forEach(function(r) {
        var b = monthBucket(r['Date']);
        if (!b) return;
        (buckets[b] = buckets[b] || []).push(r);
      });
      var months = Object.keys(buckets).sort();
      var labels = months.map(monthLabel);

      if (breakKey && breakKey !== 'none') {
        var bMeta = BUILDER_FIELDS[breakKey];
        var bLabels = bMeta.opts();
        var datasets = bLabels.map(function(bl) {
          var data = months.map(function(m) {
            return buckets[m].filter(function(r) { return (r[bMeta.csv] || '').trim() === bl; }).length;
          });
          return { label: bl, data: data, borderColor: bMeta.colorFn(bl), backgroundColor: bMeta.colorFn(bl), tension: 0.3, fill: false };
        });
        return { labels: labels, datasets: datasets };
      }

      var data = months.map(function(m) { return buckets[m].length; });
      return { labels: labels, datasets: [{ label: 'Incidents', data: data, borderColor: '#2b7fd4', backgroundColor: '#2b7fd4', tension: 0.3, fill: false }] };
    }

    // ── MAP INITIALISATION ───────────────────────────────────────────────
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [-98.5, 39.8],   // default focus: continental USA
      zoom: 3.3,
      minZoom: 2,
      maxZoom: 16,
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }), 'bottom-left');

    // Fit the map to a subset of rows matching column === value (default focus on load)
    function flyToBounds(rows, opts) {
      opts = opts || {};
      if (!rows.length) return;
      var bounds = new maplibregl.LngLatBounds();
      rows.forEach(function(row) {
        var lat = parseFloat(row['Latitude']);
        var lng = parseFloat(row['Longitude']);
        if (!isNaN(lat) && !isNaN(lng)) bounds.extend([lng, lat]);
      });
      if (bounds.isEmpty()) return;
      map.fitBounds(bounds, {
        padding: 60,
        duration: opts.animate === false ? 0 : 1000,
        maxZoom: 6,
      });
    }

    // ── GLOBAL STATE ─────────────────────────────────────────────────────
    let incidents = [];
    let activeLayer = 'target';
    let sortCol = 'Date';
    let sortAsc = true;
    let activeRowId = null;
    let activePopup = null;
    let currentFilteredRows = [];

    // ── LOAD & PARSE CSV ─────────────────────────────────────────────────
    fetch('EPdata.csv')
      .then(function(response) { return response.text(); })
      .then(function(text) {
        var results = Papa.parse(text, { header: true, skipEmptyLines: true, encoding: 'UTF-8' });
        return results.data;
      })
      .then(function(rows) {
        incidents = rows.filter(function(row) {
          return row['Latitude'] && row['Longitude'] &&
            !isNaN(parseFloat(row['Latitude'])) && !isNaN(parseFloat(row['Longitude']));
        });
        currentFilteredRows = incidents;
        console.log('Loaded incidents:', incidents.length);

        function initialFitAndAddLayer() {
          var usaRows = incidents.filter(function(r) { return (r['Country']||'').trim() === 'USA'; });
          flyToBounds(usaRows.length ? usaRows : incidents, { animate: false });
          addIncidentLayer();
        }

        if (map.loaded()) { initialFitAndAddLayer(); } else { map.on('load', initialFitAndAddLayer); }

        buildFilters();
        buildMetricsSelectors();
        renderTable(incidents);
        renderMetrics(incidents);
      })
      .catch(function(err) {
        console.error('Fetch error:', err);
        document.getElementById('tableBody').innerHTML =
          '<tr class="placeholder-row"><td colspan="5">Error loading incident data.</td></tr>';
      });

    // ── CSV TO GEOJSON ───────────────────────────────────────────────────
    function toGeoJSON(rows) {
      return {
        type: 'FeatureCollection',
        features: rows.map(function(row, i) {
          return {
            type: 'Feature',
            id: i,
            geometry: { type: 'Point', coordinates: [parseFloat(row['Longitude']), parseFloat(row['Latitude'])] },
            properties: {
              id: i,
              date: row['Date'] || '',
              target: row['Target'] || '',
              tactic: row['Tactic'] || '',
              venue: row['Venue'] || '',
              location: row['Location'] || '',
              content: row['Content'] || '',
              source: row['Source'] || '',
              target_color: colorFor('target', row['Target']),
              tactic_color: colorFor('tactic', row['Tactic']),
              venue_color:  colorFor('venue', row['Venue']),
            }
          };
        })
      };
    }

    function colorExpr(layer) { return ['get', layer + '_color']; }

    // ── ADD POINT LAYER ──────────────────────────────────────────────────
    function addIncidentLayer() {
      var geojson = toGeoJSON(incidents);

      map.addSource('incidents', { type: 'geojson', data: geojson });

      map.addLayer({
        id: 'incidents-halo',
        type: 'circle',
        source: 'incidents',
        paint: { 'circle-radius': 14, 'circle-color': colorExpr(activeLayer), 'circle-opacity': 0, 'circle-blur': 0.6 }
      });

      map.addLayer({
        id: 'incidents-circles',
        type: 'circle',
        source: 'incidents',
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 2, 3, 6, 6, 12, 10],
          'circle-color': colorExpr(activeLayer),
          'circle-stroke-width': 1.5,
          'circle-stroke-color': '#fff',
          'circle-opacity': 0.88,
        }
      });

      map.on('click', 'incidents-circles', function(e) {
        var props = e.features[0].properties;
        showPopup(props, e.features[0].geometry.coordinates);
        highlightRow(props.id);
      });
      map.on('mouseenter', 'incidents-circles', function() { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'incidents-circles', function() { map.getCanvas().style.cursor = ''; });

      buildLegend();
      applyFilters();
    }

    function showPopup(props, coords) {
      if (activePopup) activePopup.remove();
      activePopup = new maplibregl.Popup({ maxWidth: '280px', offset: 12 })
        .setLngLat(coords)
        .setHTML(
          '<strong>' + escHtml(props.target) + '</strong>' +
          '<div class="popup-title">' + escHtml(props.tactic) + ' &middot; ' + escHtml(props.venue) + '</div>' +
          '<div class="popup-meta">' +
          '<span>Date: ' + escHtml(props.date) + '</span>' +
          (props.location ? '<span>' + escHtml(props.location) + '</span>' : '') +
          '</div>'
        )
        .addTo(map);
    }

    // ── LEGEND ────────────────────────────────────────────────────────────
    var activeLegendValues = new Set();

    function buildLegend() {
      var field = LAYER_FIELD[activeLayer];
      var colorMap = LAYER_COLORS[activeLayer];
      var values = fieldOptions(activeLayer);
      if (activeLegendValues.size === 0) activeLegendValues = new Set(values);
      renderLegend(field, colorMap, values);
    }

    function renderLegend(field, colorMap, values) {
      var allActive = activeLegendValues.size === values.length;
      var html = '<div class="legend-title">' + LAYER_LABEL[activeLayer] + '</div>';
      values.sort().forEach(function(val) {
        var color = colorMap[val] || DEFAULT_COLOR;
        var active = activeLegendValues.has(val);
        html += '<div class="legend-row inc-legend-row" data-val="' + escHtml(val) + '" style="cursor:pointer;" title="Click to toggle">' +
          '<span class="legend-swatch" style="background:' + (active ? color : 'transparent') + ';border:2px solid ' + color + ';box-sizing:border-box;transition:background .15s;"></span>' +
          '<span class="legend-label" style="opacity:' + (active ? '1' : '0.4') + ';transition:opacity .15s;">' + escHtml(val) + '</span>' +
          '</div>';
      });
      if (!allActive) {
        html += '<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--border);">' +
          '<span id="legendResetFilter" style="font-family:var(--font-ui);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);cursor:pointer;">Show all</span>' +
          '</div>';
      }
      var legend = document.getElementById('mapLegend');
      legend.innerHTML = html;

      legend.querySelectorAll('.inc-legend-row').forEach(function(row) {
        row.addEventListener('click', function() {
          var val = row.dataset.val;
          if (activeLegendValues.has(val)) {
            if (activeLegendValues.size > 1) activeLegendValues.delete(val);
          } else {
            activeLegendValues.add(val);
          }
          buildLegend();
          applyLegendFilter();
        });
      });
      var resetEl = legend.querySelector('#legendResetFilter');
      if (resetEl) {
        resetEl.addEventListener('click', function() {
          activeLegendValues = new Set(values);
          buildLegend();
          applyLegendFilter();
        });
      }
    }

    function applyLegendFilter() {
      if (!map.getLayer('incidents-circles')) return;
      var field = activeLayer; // 'target' | 'tactic' | 'venue'
      var colorMap = LAYER_COLORS[activeLayer];
      var allValues = Object.keys(colorMap);
      var activeColors = Array.from(activeLegendValues).map(function(v) { return colorMap[v] || DEFAULT_COLOR; });
      var expr = activeColors.length === allValues.length
        ? null
        : ['in', colorExpr(activeLayer), ['literal', activeColors]];
      ['incidents-circles', 'incidents-halo'].forEach(function(id) {
        if (map.getLayer(id)) map.setFilter(id, expr);
      });
    }

    // ── LAYER SWITCHER ───────────────────────────────────────────────────
    document.querySelectorAll('.layer-btn input').forEach(function(radio) {
      radio.addEventListener('change', function(e) {
        document.querySelectorAll('.layer-btn').forEach(function(b) { b.classList.remove('active'); });
        e.target.closest('.layer-btn').classList.add('active');
        activeLayer = e.target.value;

        var isBuilder = activeLayer === 'builder';
        document.getElementById('mapSection').style.display = isBuilder ? 'none' : '';
        document.getElementById('vDivider').style.display = isBuilder ? 'none' : '';
        document.getElementById('metricsSectionPanel').style.display = isBuilder ? 'none' : '';
        document.getElementById('builderSectionPanel').style.display = isBuilder ? 'flex' : 'none';

        if (isBuilder) {
          resizeBuilderCharts();
          return;
        }

        activeLegendValues = new Set();
        if (map.getSource('incidents')) {
          map.getSource('incidents').setData(toGeoJSON(currentFilteredRows));
        }
        if (map.getLayer('incidents-circles')) {
          map.setPaintProperty('incidents-circles', 'circle-color', colorExpr(activeLayer));
          map.setPaintProperty('incidents-halo', 'circle-color', colorExpr(activeLayer));
        }
        buildLegend();
        applyLegendFilter();
        renderTable(currentFilteredRows);
        syncMetricsToActiveLayer();
        // The map's container was display:none while the builder was active;
        // MapLibre needs an explicit resize once it's visible again.
        setTimeout(function() { map.resize(); }, 0);
      });
    });

    // ── FILTERS ───────────────────────────────────────────────────────────
    var msState = { target: new Set(), tactic: new Set(), venue: new Set(), country: new Set() };

    function buildMultiSelect(key, containerId, options, placeholder) {
      var wrap = document.getElementById(containerId);
      wrap.innerHTML = '';
      var btn = document.createElement('button');
      btn.className = 'filter-input filter-select ms-btn';
      btn.type = 'button';
      var panel = document.createElement('div');
      panel.className = 'ms-panel';
      panel.style.display = 'none';

      function updateBtn() {
        var sel = msState[key];
        if (sel.size === 0) { btn.textContent = placeholder; btn.classList.remove('ms-active'); }
        else if (sel.size === 1) { var v = Array.from(sel)[0]; btn.textContent = v.length > 18 ? v.slice(0,16) + '…' : v; btn.classList.add('ms-active'); }
        else { btn.textContent = sel.size + ' selected'; btn.classList.add('ms-active'); }
      }

      function buildPanel() {
        panel.innerHTML = '';
        var allRow = document.createElement('div');
        allRow.className = 'ms-row ms-all-row';
        allRow.innerHTML = '<span class="ms-all-label">All / None</span>';
        allRow.addEventListener('click', function() {
          if (msState[key].size === options.length) { msState[key].clear(); }
          else { options.forEach(function(o) { msState[key].add(o); }); }
          buildPanel(); updateBtn(); applyFilters();
        });
        panel.appendChild(allRow);
        var divEl = document.createElement('div');
        divEl.className = 'ms-divider';
        panel.appendChild(divEl);

        options.forEach(function(opt) {
          var row = document.createElement('div');
          row.className = 'ms-row' + (msState[key].has(opt) ? ' ms-checked' : '');
          var check = document.createElement('span');
          check.className = 'ms-check';
          check.innerHTML = msState[key].has(opt)
            ? '<svg width="10" height="10" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            : '';
          var label = document.createElement('span');
          label.className = 'ms-option-label';
          label.textContent = opt;
          row.appendChild(check); row.appendChild(label);
          row.addEventListener('click', function(e) {
            e.stopPropagation();
            if (msState[key].has(opt)) { msState[key].delete(opt); } else { msState[key].add(opt); }
            buildPanel(); updateBtn(); applyFilters();
          });
          panel.appendChild(row);
        });
      }

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var isOpen = panel.style.display !== 'none';
        document.querySelectorAll('.ms-panel').forEach(function(p) { p.style.display = 'none'; });
        if (!isOpen) { buildPanel(); panel.style.display = 'block'; }
      });

      wrap.appendChild(btn); wrap.appendChild(panel);
      updateBtn();
    }

    function buildFilters() {
      ['target','tactic','venue'].forEach(function(key) {
        var field = LAYER_FIELD[key];
        var opts = fieldOptions(key);
        buildMultiSelect(key, 'ms' + field, opts, 'All ' + field.toLowerCase() + 's');
      });

      var countryOpts = Array.from(new Set(incidents.map(function(r){ return (r['Country']||'').trim(); }).filter(Boolean))).sort();
      buildMultiSelect('country', 'msCountry', countryOpts, 'All countries');

      ['filterDateFrom','filterDateTo','filterSearch'].forEach(function(id){
        document.getElementById(id).addEventListener('input', applyFilters);
      });

      document.addEventListener('click', function() {
        document.querySelectorAll('.ms-panel').forEach(function(p) { p.style.display = 'none'; });
      });

      document.getElementById('filterReset').addEventListener('click', function(){
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        document.getElementById('filterSearch').value = '';
        msState.target.clear(); msState.tactic.clear(); msState.venue.clear(); msState.country.clear();
        buildFilters();
        applyFilters();
      });
    }

    var MONTHS = {
      'January':'01','February':'02','March':'03','April':'04','May':'05','June':'06',
      'July':'07','August':'08','September':'09','October':'10','November':'11','December':'12'
    };
    function toISO(d) {
      if (!d) return '';
      var parts = d.trim().split(' ');
      if (parts.length === 3 && MONTHS[parts[1]]) {
        return parts[2] + '-' + MONTHS[parts[1]] + '-' + parts[0].padStart(2, '0');
      }
      var slashParts = d.split('/');
      if (slashParts.length === 3) {
        return slashParts[2] + '-' + slashParts[0].padStart(2,'0') + '-' + slashParts[1].padStart(2,'0');
      }
      return d;
    }

    // ── Boolean search ───────────────────────────────────────────────────
    // "judge OR justice"        -> matches rows containing either word
    // "judge threat"            -> matches rows containing BOTH words (AND)
    // "-settled"                -> excludes rows containing "settled"
    // "\"written threat\""      -> matches that exact phrase
    // -word exclusions apply globally across every OR branch, e.g.
    // "judge OR justice -settled" means (judge OR justice) AND NOT settled.
    function parseSearchQuery(raw) {
      var excludeTerms = [];
      var withoutExcludes = raw.replace(/(^|\s)-("[^"]+"|\S+)/g, function(match, pre, tok) {
        var t = tok.replace(/^"|"$/g, '').toLowerCase();
        if (t) excludeTerms.push(t);
        return pre;
      });

      var orGroups = withoutExcludes.trim().split(/\s+OR\s+/i).map(function(group) {
        var terms = [];
        var re = /"([^"]+)"|(\S+)/g;
        var m;
        while ((m = re.exec(group)) !== null) {
          var token = m[1] !== undefined ? m[1] : m[2];
          if (token) terms.push(token.toLowerCase());
        }
        return terms;
      }).filter(function(group) { return group.length > 0; });

      return { orGroups: orGroups, excludeTerms: excludeTerms };
    }

    function matchesSearch(haystack, parsed) {
      for (var i = 0; i < parsed.excludeTerms.length; i++) {
        if (haystack.indexOf(parsed.excludeTerms[i]) !== -1) return false;
      }
      if (!parsed.orGroups.length) return true;
      return parsed.orGroups.some(function(group) {
        return group.every(function(term) { return haystack.indexOf(term) !== -1; });
      });
    }

    function applyFilters() {
      var dateFrom = document.getElementById('filterDateFrom').value;
      var dateTo   = document.getElementById('filterDateTo').value;
      var searchRaw = document.getElementById('filterSearch').value.trim();
      var searchParsed = searchRaw ? parseSearchQuery(searchRaw) : null;

      var filtered = incidents.filter(function(row) {
        var d = toISO(row['Date'] || '');
        if (dateFrom && d < dateFrom) return false;
        if (dateTo   && d > dateTo)   return false;
        if (msState.target.size > 0 && !msState.target.has((row['Target']||'').trim())) return false;
        if (msState.tactic.size > 0 && !msState.tactic.has((row['Tactic']||'').trim())) return false;
        if (msState.venue.size  > 0 && !msState.venue.has((row['Venue']||'').trim()))   return false;
        if (msState.country.size > 0 && !msState.country.has((row['Country']||'').trim())) return false;
        if (searchParsed) {
          var haystack = [row['Content'],row['City'],row['Country'],row['Target'],row['Tactic'],row['Venue']].join(' ').toLowerCase();
          if (!matchesSearch(haystack, searchParsed)) return false;
        }
        return true;
      });

      // Update table/metrics/builder charts first, unconditionally -- these
      // must never be blocked by anything map-related.
      currentFilteredRows = filtered;
      renderTable(filtered);
      renderMetrics(filtered);
      refreshBuilderCharts();

      // Skip touching the map entirely while its container is hidden behind
      // the Metrics Builder panel (display:none) -- MapLibre can misbehave
      // when asked to update a zero-size, invisible map. It gets caught up
      // with the latest filtered data when the user switches back to a real
      // layer (see the layer switcher below).
      if (activeLayer !== 'builder' && map.getSource('incidents')) {
        map.getSource('incidents').setData(toGeoJSON(filtered));
        applyLegendFilter();
      }
    }

    // ── TABLE ─────────────────────────────────────────────────────────────
    function escHtml(s) {
      return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Robust expand/collapse: display:none is the only way to guarantee a
    // fully closed row takes up zero space (max-height/overflow tricks alone
    // can leave a residual sliver in some browsers). JS toggles display via
    // inline style, only using table-row while a row is open or animating.
    function openExpandRow(expandRow) {
      var body = expandRow.querySelector('.expand-body');
      expandRow.style.display = 'table-row';
      // Force a layout flush so the browser registers the closed (0) state
      // before we change it -- otherwise the transition can get skipped.
      void body.offsetHeight;
      body.style.maxHeight = body.scrollHeight + 'px';
      expandRow.classList.add('open');

      function onEnd(e) {
        if (e.target !== body || e.propertyName !== 'max-height') return;
        // Release the fixed height once open, so later reflows (a web font
        // finishing loading, a window resize, etc.) can never clip content
        // that was measured before they happened.
        body.style.maxHeight = 'none';
        body.removeEventListener('transitionend', onEnd);
      }
      body.addEventListener('transitionend', onEnd);
    }

    function closeExpandRow(expandRow) {
      var body = expandRow.querySelector('.expand-body');
      if (!expandRow.classList.contains('open')) { expandRow.style.display = 'none'; return; }

      // max-height may currently be 'none' (released after opening) -- pin
      // it to an explicit pixel value first so there's something concrete
      // to animate down from.
      body.style.maxHeight = body.scrollHeight + 'px';
      void body.offsetHeight;
      body.style.maxHeight = '0px';
      expandRow.classList.remove('open');

      function onEnd(e) {
        if (e.target !== body || e.propertyName !== 'max-height') return;
        expandRow.style.display = 'none';
        body.removeEventListener('transitionend', onEnd);
      }
      body.addEventListener('transitionend', onEnd);
    }

    function renderTable(rows) {
      var tbody = document.getElementById('tableBody');
      document.getElementById('tableCount').textContent = rows.length + ' incident' + (rows.length !== 1 ? 's' : '');

      if (!rows.length) {
        tbody.innerHTML = '<tr class="placeholder-row"><td colspan="5">No incidents to display.</td></tr>';
        return;
      }

      // Pill/badge coloring is grounded to the active map layer only — it never
      // moves columns and is never affected by the current filter selection,
      // just by which of Target/Tactic/Venue is the active visualization layer.
      function cellFor(fieldKey, row) {
        var field = LAYER_FIELD[fieldKey];
        var val = row[field] || '--';
        if (fieldKey === activeLayer) {
          var color = colorFor(fieldKey, row[field]);
          return '<td class="has-badge"><span class="type-badge" style="background:' + color + '">' + escHtml(val) + '</span></td>';
        }
        return '<td>' + escHtml(val) + '</td>';
      }

      function sourceHtml(src) {
        if (!src) return '';
        var isUrl = /^https?:\/\//i.test(src.trim());
        if (isUrl) {
          return '<div class="expand-source">' +
            '<a href="' + escHtml(src.trim()) + '" target="_blank" rel="noopener" class="expand-source-icon" title="Open source">' +
            '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>' +
            '<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>' +
            '</svg></a></div>';
        }
        return '<div class="expand-source"><span class="expand-source-text" title="' + escHtml(src) + '">' + escHtml(src.length > 20 ? src.slice(0, 18) + '…' : src) + '</span></div>';
      }

      tbody.innerHTML = rows.map(function(row) {
        var origIdx = incidents.indexOf(row);
        var loc = (row['Location'] || '--');
        var locShort = loc.length > 40 ? loc.substring(0, 40) + '...' : loc;
        var content = escHtml(row['Content'] || '');
        var isActive = origIdx === activeRowId;

        return '<tr data-id="' + origIdx + '" class="main-row' + (isActive ? ' active' : '') + '">' +
          '<td>' + (row['Date'] || '--') + '</td>' +
          cellFor('target', row) +
          cellFor('tactic', row) +
          cellFor('venue', row) +
          '<td title="' + escHtml(loc) + '">' + escHtml(locShort) + '</td>' +
          '</tr>' +
          '<tr class="expand-row" data-expand-id="' + origIdx + '">' +
          '<td colspan="5">' +
          '<div class="expand-body">' +
          '<div class="expand-content">' +
          (content ? '<div class="expand-label">Content</div><div class="expand-text">' + content + '</div>' : '<span class="expand-none">No content recorded</span>') +
          '</div>' +
          sourceHtml(row['Source'] || '') +
          '</div>' +
          '</td>' +
          '</tr>';
      }).join('');

      tbody.querySelectorAll('tr.main-row').forEach(function(tr) {
        tr.addEventListener('click', function() {
          var id = parseInt(tr.dataset.id);
          var row = incidents[id];
          var lng = parseFloat(row['Longitude']);
          var lat = parseFloat(row['Latitude']);

          var expandRow = tbody.querySelector('tr.expand-row[data-expand-id="' + id + '"]');
          var isOpen = expandRow.classList.contains('open');

          tbody.querySelectorAll('tr.expand-row.open').forEach(function(er) {
            if (er !== expandRow) closeExpandRow(er);
          });

          if (!isOpen) {
            openExpandRow(expandRow);
          } else {
            closeExpandRow(expandRow);
          }

          map.flyTo({ center: [lng, lat], zoom: 8, speed: 1.2 });

          showPopup({
            target: row['Target'], tactic: row['Tactic'], venue: row['Venue'],
            date: row['Date'], location: row['Location']
          }, [lng, lat]);

          highlightRow(id);
        });
      });
    }

    function highlightRow(id) {
      activeRowId = id;
      document.querySelectorAll('#tableBody tr.main-row').forEach(function(tr) {
        tr.classList.toggle('active', parseInt(tr.dataset.id) === id);
      });
      var activeEl = document.querySelector('#tableBody tr.main-row[data-id="' + id + '"]');
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    // ── COLUMN SORTING ───────────────────────────────────────────────────
    document.querySelectorAll('#incidentTable thead th[data-col]').forEach(function(th) {
      th.addEventListener('click', function() {
        var col = th.dataset.col;
        sortAsc = (sortCol === col) ? !sortAsc : true;
        sortCol = col;

        var sorted = incidents.slice().sort(function(a, b) {
          var av = a[col] || '', bv = b[col] || '';
          if (col === 'Date') {
            av = toISO(av);
            bv = toISO(bv);
          }
          return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
        });

        document.querySelectorAll('.sort-icon').forEach(function(el) { el.textContent = String.fromCharCode(8597); });
        th.querySelector('.sort-icon').textContent = sortAsc ? String.fromCharCode(8593) : String.fromCharCode(8595);
        renderTable(sorted);
      });
    });

    // ── METRICS ───────────────────────────────────────────────────────────
    // Group by / break down by selectors let the user build stacked vertical
    // bar charts across the three categorical layers (Target/Tactic/Venue),
    // e.g. "Target on the x-axis, stacked by Tactic". Group By is not a
    // separate control -- it always mirrors whichever map layer tab is
    // active. Break Down By is the one user-facing selector, inline with
    // the chart title.
    var CHART_DEFAULTS = { color: '#c9d1d9', gridColor: 'rgba(255,255,255,0.06)' };
    var metricsState = { groupBy: 'target', breakBy: 'none' };
    var mainChart = null;

    // Repeating diagonal TorchStone watermark tiled across the chart's plot
    // area background (behind the bars), so it's included whenever the
    // chart is copied or downloaded as an image.
    var tsWatermarkPlugin = {
      id: 'tsWatermark',
      beforeDraw: function(chart) {
        var ctx = chart.ctx;
        var area = chart.chartArea;
        if (!area) return;
        var areaW = area.right - area.left, areaH = area.bottom - area.top;
        if (areaW < 40 || areaH < 40) return;
        ctx.save();
        ctx.beginPath();
        ctx.rect(area.left, area.top, areaW, areaH);
        ctx.clip();
        ctx.globalAlpha = 0.06;
        ctx.fillStyle = '#9fb0c8';
        ctx.font = "600 12px 'DM Mono', monospace";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.translate((area.left + area.right) / 2, (area.top + area.bottom) / 2);
        ctx.rotate(-28 * Math.PI / 180);
        var spanX = areaW * 1.8, spanY = areaH * 1.8;
        var stepX = 150, stepY = 46;
        for (var y = -spanY / 2; y < spanY / 2; y += stepY) {
          for (var x = -spanX / 2; x < spanX / 2; x += stepX) {
            ctx.fillText('TORCHSTONE GLOBAL', x, y);
          }
        }
        ctx.restore();
      }
    };
    Chart.register(tsWatermarkPlugin);

    function buildMetricsSelectors() {
      metricsState.groupBy = activeLayer;
      var breakSel = document.getElementById('metricsBreakBy');
      var layerOpts = ['target','tactic','venue'].map(function(k){ return { value: k, label: LAYER_LABEL[k] }; });
      var breakOpts = [{ value: 'none', label: 'No breakdown' }]
        .concat(layerOpts.filter(function(o) { return o.value !== metricsState.groupBy; }));
      if (breakOpts.every(function(o){ return o.value !== metricsState.breakBy; })) metricsState.breakBy = 'none';

      breakSel.innerHTML = breakOpts.map(function(o) {
        return '<option value="' + o.value + '"' + (o.value === metricsState.breakBy ? ' selected' : '') + '>' + o.label + '</option>';
      }).join('');

      breakSel.onchange = function() {
        metricsState.breakBy = breakSel.value;
        renderMetrics(currentFilteredRows);
      };
    }

    // Shared Chart.js options builder for both on-screen (dark) and export
    // (light, titled, higher-res) renders — used by the metrics chart, every
    // Metrics Builder chart, and their exports.
    function buildChartOptions(spec, theme) {
      var dark = theme === 'dark';
      var textColor = dark ? CHART_DEFAULTS.color : '#333d4d';
      var gridColor = dark ? CHART_DEFAULTS.gridColor : '#e7e9ec';
      var borderColor = dark ? 'transparent' : '#c7cdd6';

      var opts = {
        responsive: dark,
        maintainAspectRatio: false,
        indexAxis: spec.indexAxis || 'x',
        plugins: {
          legend: {
            display: spec.showLegend,
            position: spec.chartType === 'pie' ? 'right' : 'bottom',
            labels: { color: textColor, font: { size: dark ? 10.5 : 12 }, boxWidth: dark ? 11 : 12, padding: dark ? 10 : 12 }
          }
        }
      };

      if (!dark) {
        opts.devicePixelRatio = 3;
        opts.animation = false;
        opts.plugins.tsWatermark = false;
        opts.plugins.title = { display: true, text: spec.title, color: '#1a2233', font: { size: 16, weight: '600', family: "'DM Sans', sans-serif" }, padding: { bottom: 16 } };
        opts.layout = { padding: { top: 4, right: 14, bottom: 4, left: 4 } };
      }

      if (spec.chartType !== 'pie') {
        opts.scales = {
          x: {
            stacked: !!spec.stacked,
            ticks: { color: textColor, font: { size: dark ? 11 : 12 }, maxRotation: 40, minRotation: 0 },
            grid: { display: spec.indexAxis === 'y', color: gridColor },
            border: { color: borderColor }
          },
          y: {
            stacked: !!spec.stacked,
            beginAtZero: true,
            ticks: { color: textColor, font: { size: dark ? 11 : 12 }, precision: 0 },
            grid: { display: spec.indexAxis !== 'y', color: gridColor },
            border: { color: borderColor }
          }
        };
      }

      return opts;
    }

    function renderMetrics(rows) {
      if (!rows) rows = incidents;
      var groupKey = metricsState.groupBy;
      var breakKey = metricsState.breakBy;
      var stacked = breakKey !== 'none';

      var titleEl = document.getElementById('metricsChartTitle');
      var titleText = stacked
        ? 'Breakdown of ' + BUILDER_FIELDS[groupKey].label + ' by ' + BUILDER_FIELDS[breakKey].label
        : 'Incidents by ' + BUILDER_FIELDS[groupKey].label;
      titleEl.textContent = titleText;

      var spec = { chartType: 'bar', indexAxis: 'x', stacked: stacked, data: buildCategoricalData(rows, groupKey, breakKey), title: titleText, showLegend: stacked };
      var ctx = document.getElementById('chartMain');

      if (mainChart) { mainChart.destroy(); mainChart = null; }
      mainChart = new Chart(ctx, { type: spec.chartType, data: spec.data, options: buildChartOptions(spec, 'dark') });
    }

    // ── Layer tabs keep the metrics chart's implicit "group by" in sync ────
    function syncMetricsToActiveLayer() {
      buildMetricsSelectors();
      renderMetrics(currentFilteredRows);
    }

    // ── Export chart: a separate high-res, light-theme, titled render ──────
    // used only for Copy buttons, so pasted images are legible in reports
    // (white background, dark text, title baked in) regardless of the
    // dashboard's dark on-screen theme. Takes the same "spec" shape used for
    // on-screen charts: { chartType, indexAxis, stacked, data, title, showLegend }.
    function buildExportChart(spec) {
      var canvas = document.createElement('canvas');
      canvas.width = 900;
      canvas.height = 520;

      var whiteBgPlugin = {
        id: 'exportBg',
        beforeDraw: function(chart) {
          var ctx = chart.ctx;
          ctx.save();
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, chart.width, chart.height);
          ctx.restore();
        }
      };

      var lightWatermarkPlugin = {
        id: 'exportWatermark',
        beforeDatasetsDraw: function(chart) {
          var ctx = chart.ctx;
          var area = chart.chartArea;
          if (!area) return;
          var areaW = area.right - area.left, areaH = area.bottom - area.top;
          if (areaW < 40 || areaH < 40) return;
          ctx.save();
          ctx.beginPath();
          ctx.rect(area.left, area.top, areaW, areaH);
          ctx.clip();
          ctx.globalAlpha = 0.07;
          ctx.fillStyle = '#1b3664';
          ctx.font = "600 13px 'DM Mono', monospace";
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.translate((area.left + area.right) / 2, (area.top + area.bottom) / 2);
          ctx.rotate(-28 * Math.PI / 180);
          var spanX = areaW * 1.8, spanY = areaH * 1.8;
          var stepX = 165, stepY = 50;
          for (var y = -spanY / 2; y < spanY / 2; y += stepY) {
            for (var x = -spanX / 2; x < spanX / 2; x += stepX) {
              ctx.fillText('TORCHSTONE GLOBAL', x, y);
            }
          }
          ctx.restore();
        }
      };

      var chart = new Chart(canvas, {
        type: spec.chartType,
        data: spec.data,
        plugins: [whiteBgPlugin, lightWatermarkPlugin],
        options: buildChartOptions(spec, 'light')
      });

      return { canvas: canvas, chart: chart };
    }

    // ── Copy chart image to clipboard (falls back to download) ─────────────
    var COPY_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    var CHECK_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    var DELETE_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';

    // Shared by the metrics panel's Copy button and every Metrics Builder
    // card's Copy button.
    function copyChartSpec(spec, btn) {
      var built = buildExportChart(spec);
      var exportCanvas = built.canvas, exportChart = built.chart;

      // Two animation frames gives Chart.js time to fully paint before capture,
      // even with animation disabled.
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          exportCanvas.toBlob(function(blob) {
            exportChart.destroy();
            if (!blob) return;
            function flash(titleTxt) {
              btn.innerHTML = CHECK_ICON;
              btn.title = titleTxt;
              setTimeout(function() { btn.innerHTML = COPY_ICON; btn.title = 'Copy chart image to clipboard'; }, 1400);
            }
            function downloadFallback() {
              var url = URL.createObjectURL(blob);
              var a = document.createElement('a');
              a.href = url; a.download = 'torchstone-chart.png';
              document.body.appendChild(a); a.click(); document.body.removeChild(a);
              URL.revokeObjectURL(url);
              flash('Saved as PNG file');
            }
            if (navigator.clipboard && window.ClipboardItem) {
              navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
                .then(function() { flash('Copied to clipboard'); })
                .catch(function(err) { console.warn('Clipboard write failed, downloading instead:', err); downloadFallback(); });
            } else {
              downloadFallback();
            }
          }, 'image/png');
        });
      });
    }

    document.getElementById('metricsCopyBtn').addEventListener('click', function() {
      var titleText = document.getElementById('metricsChartTitle').textContent;
      var breakKey = metricsState.breakBy;
      var stacked = breakKey !== 'none';
      var spec = { chartType: 'bar', indexAxis: 'x', stacked: stacked, data: buildCategoricalData(currentFilteredRows, metricsState.groupBy, breakKey), title: titleText, showLegend: stacked };
      copyChartSpec(spec, this);
    });

    // ── Metrics Builder ──────────────────────────────────────────────────
    // A user-built grid of charts, independent of the map layer tabs. Each
    // chart has its own type/x-axis/breakdown, chosen from all five
    // categorical fields (Target/Tactic/Venue/Country/Domestic-Int'l), plus
    // a Line-over-time type bucketed by month. Charts reset each session
    // (nothing is persisted to storage).
    var builderCharts = [];
    var builderIdCounter = 0;

    function builderChartTitle(cfg) {
      if (cfg.type === 'line') {
        return (cfg.breakKey && cfg.breakKey !== 'none')
          ? 'Incidents Over Time by ' + BUILDER_FIELDS[cfg.breakKey].label
          : 'Incidents Over Time';
      }
      if (cfg.type === 'sbar' && cfg.breakKey && cfg.breakKey !== 'none') {
        return 'Breakdown of ' + BUILDER_FIELDS[cfg.xKey].label + ' by ' + BUILDER_FIELDS[cfg.breakKey].label;
      }
      return 'Incidents by ' + BUILDER_FIELDS[cfg.xKey].label;
    }

    function buildBuilderSpec(rows, cfg) {
      var title = builderChartTitle(cfg);
      if (cfg.type === 'line') {
        var lbk = (cfg.breakKey && cfg.breakKey !== 'none') ? cfg.breakKey : 'none';
        var ld = buildLineData(rows, lbk);
        return { chartType: 'line', indexAxis: 'x', stacked: false, data: ld, showLegend: ld.datasets.length > 1, title: title };
      }
      if (cfg.type === 'pie') {
        var pd = buildCategoricalData(rows, cfg.xKey, 'none');
        return { chartType: 'pie', indexAxis: 'x', stacked: false, data: pd, showLegend: true, title: title };
      }
      if (cfg.type === 'sbar') {
        var sbk = (cfg.breakKey && cfg.breakKey !== 'none') ? cfg.breakKey : BUILDER_FIELD_ORDER.filter(function(f) { return f !== cfg.xKey; })[0];
        var sd = buildCategoricalData(rows, cfg.xKey, sbk);
        return { chartType: 'bar', indexAxis: 'x', stacked: true, data: sd, showLegend: true, title: title };
      }
      if (cfg.type === 'hbar') {
        var hd = buildCategoricalData(rows, cfg.xKey, 'none');
        return { chartType: 'bar', indexAxis: 'y', stacked: false, data: hd, showLegend: false, title: title };
      }
      // vbar (default)
      var vd = buildCategoricalData(rows, cfg.xKey, 'none');
      return { chartType: 'bar', indexAxis: 'x', stacked: false, data: vd, showLegend: false, title: title };
    }

    function populateBuilderSelectors() {
      var typeSel = document.getElementById('builderType');
      var xSel = document.getElementById('builderX');
      var breakSel = document.getElementById('builderBreak');
      var breakGroup = document.getElementById('builderBreakGroup');
      var isLine = typeSel.value === 'line';
      var fieldOpts = BUILDER_FIELD_ORDER.map(function(k) { return { value: k, label: BUILDER_FIELDS[k].label }; });

      if (isLine) {
        xSel.innerHTML = '<option value="date">Date (by month)</option>';
        xSel.disabled = true;
      } else {
        xSel.disabled = false;
        var curX = (xSel.value && xSel.value !== 'date') ? xSel.value : 'target';
        xSel.innerHTML = fieldOpts.map(function(o) {
          return '<option value="' + o.value + '"' + (o.value === curX ? ' selected' : '') + '>' + o.label + '</option>';
        }).join('');
      }

      var breakdownAllowed = (typeSel.value === 'sbar' || typeSel.value === 'line');
      breakGroup.style.display = breakdownAllowed ? '' : 'none';
      if (breakdownAllowed) {
        var xVal = isLine ? null : xSel.value;
        var breakOpts = [{ value: 'none', label: isLine ? 'Single line' : 'No breakdown' }]
          .concat(fieldOpts.filter(function(o) { return o.value !== xVal; }));
        var curB = breakSel.value || 'none';
        if (breakOpts.every(function(o) { return o.value !== curB; })) curB = 'none';
        breakSel.innerHTML = breakOpts.map(function(o) {
          return '<option value="' + o.value + '"' + (o.value === curB ? ' selected' : '') + '>' + o.label + '</option>';
        }).join('');
      }
    }

    document.getElementById('builderType').addEventListener('change', populateBuilderSelectors);
    document.getElementById('builderX').addEventListener('change', populateBuilderSelectors);
    populateBuilderSelectors();

    function builderCardHtml(cfg) {
      return '<div class="metrics-card builder-card" data-builder-id="' + cfg.id + '">' +
        '<div class="builder-card-actions">' +
          '<button type="button" class="metrics-copy-btn builder-copy-btn" data-id="' + cfg.id + '" title="Copy chart image to clipboard">' + COPY_ICON + '</button>' +
          '<button type="button" class="metrics-copy-btn builder-delete-btn" data-id="' + cfg.id + '" title="Delete chart">' + DELETE_ICON + '</button>' +
        '</div>' +
        '<div class="metrics-card-header"><span class="metrics-card-title">' + escHtml(builderChartTitle(cfg)) + '</span></div>' +
        '<div class="metrics-chart-wrap metrics-chart-wrap-full"><canvas id="builderCanvas-' + cfg.id + '"></canvas></div>' +
      '</div>';
    }

    // Adds one new chart: appends its card + creates its Chart.js instance.
    // Existing cards/instances are left completely untouched.
    function addBuilderCard(cfg) {
      var grid = document.getElementById('builderGrid');
      document.getElementById('builderEmpty').style.display = 'none';
      grid.insertAdjacentHTML('beforeend', builderCardHtml(cfg));

      var canvas = document.getElementById('builderCanvas-' + cfg.id);
      var spec = buildBuilderSpec(currentFilteredRows, cfg);
      cfg.chartInstance = new Chart(canvas, { type: spec.chartType, data: spec.data, options: buildChartOptions(spec, 'dark') });

      var copyBtn = grid.querySelector('.builder-copy-btn[data-id="' + cfg.id + '"]');
      copyBtn.addEventListener('click', function() { copyChartSpec(buildBuilderSpec(currentFilteredRows, cfg), copyBtn); });

      var delBtn = grid.querySelector('.builder-delete-btn[data-id="' + cfg.id + '"]');
      delBtn.addEventListener('click', function() { removeBuilderCard(cfg.id); });
    }

    // Removes exactly one chart: destroys its instance and its card only.
    function removeBuilderCard(id) {
      var idx = builderCharts.findIndex(function(c) { return c.id === id; });
      if (idx === -1) return;
      if (builderCharts[idx].chartInstance) builderCharts[idx].chartInstance.destroy();
      builderCharts.splice(idx, 1);

      var cardEl = document.querySelector('.builder-card[data-builder-id="' + id + '"]');
      if (cardEl) cardEl.remove();
      if (!builderCharts.length) document.getElementById('builderEmpty').style.display = '';
    }

    // Called on every filter change, regardless of which tab is active.
    // Updates each existing chart's data in place (no destroy/recreate, no
    // DOM rebuild) -- fast even with several charts, and safe to call while
    // the builder panel is hidden (Chart.js just updates its data model;
    // the canvas repaints once the container is visible again).
    function refreshBuilderCharts() {
      builderCharts.forEach(function(cfg) {
        if (!cfg.chartInstance) return;
        var spec = buildBuilderSpec(currentFilteredRows, cfg);
        cfg.chartInstance.data = spec.data;
        cfg.chartInstance.update('none');
      });
    }

    // Called when the Metrics Builder tab becomes active: charts' data is
    // already current (kept in sync live by refreshBuilderCharts), they just
    // need an explicit resize now that their container has real dimensions
    // again after being display:none.
    function resizeBuilderCharts() {
      builderCharts.forEach(function(cfg) { if (cfg.chartInstance) cfg.chartInstance.resize(); });
    }

    document.getElementById('builderAddBtn').addEventListener('click', function() {
      var type = document.getElementById('builderType').value;
      var xSelVal = document.getElementById('builderX').value;
      var xKey = xSelVal === 'date' ? 'date' : xSelVal;
      var breakGroupVisible = document.getElementById('builderBreakGroup').style.display !== 'none';
      var breakKey = breakGroupVisible ? document.getElementById('builderBreak').value : 'none';

      builderIdCounter++;
      var cfg = { id: builderIdCounter, type: type, xKey: xKey, breakKey: breakKey, chartInstance: null };
      builderCharts.push(cfg);
      addBuilderCard(cfg);
    });
  </script>

  <style>

    .popup-title {
      font-size: 12px;
      font-weight: 500;
      margin: 4px 0 6px;
      line-height: 1.4;
      color: #e7edf5;
    }
    .popup-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11.5px;
      color: #8898b3;
    }
  </style>

  <script>
    // RESIZABLE SPLIT PANE (left/right)
    (function() {
      var divider = document.getElementById('divider');
      var layout  = divider.closest('.layout');
      var dragging = false;

      divider.addEventListener('mousedown', function(e) {
        dragging = true;
        divider.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        var rect  = layout.getBoundingClientRect();
        var leftW = e.clientX - rect.left;
        var total = rect.width - 8;
        leftW = Math.max(260, Math.min(leftW, total - 260));
        var pct = (leftW / rect.width * 100).toFixed(2);
        layout.style.gridTemplateColumns = pct + '% 8px 1fr';
        if (window.map) map.resize();
      });

      document.addEventListener('mouseup', function() {
        if (!dragging) return;
        dragging = false;
        divider.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        if (window.map) map.resize();
      });
    })();

    // RESIZABLE SPLIT PANE (map / metrics)
    (function() {
      var vDivider  = document.getElementById('vDivider');
      var leftPanel = vDivider.closest('.left-panel');
      var mapSection = leftPanel.querySelector('.map-section');
      var draggingV = false;

      vDivider.addEventListener('mousedown', function(e) {
        draggingV = true;
        vDivider.classList.add('dragging');
        document.body.style.cursor = 'row-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', function(e) {
        if (!draggingV) return;
        var rect  = leftPanel.getBoundingClientRect();
        var topH  = e.clientY - rect.top;
        var total = rect.height - 8;
        topH = Math.max(120, Math.min(topH, total - 120));
        var pct = (topH / rect.height * 100).toFixed(2);
        mapSection.style.flex = '0 0 ' + pct + '%';
        if (window.map) map.resize();
      });

      document.addEventListener('mouseup', function() {
        if (!draggingV) return;
        draggingV = false;
        vDivider.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        if (window.map) map.resize();
      });
    })();
  </script>

</body>
